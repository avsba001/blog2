# 仅供 Deploy to Cloudflare 按钮读取。现有部署仍使用 backend/wrangler.toml。
name = "blog2"
main = "backend/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["assets_navigation_prefers_asset_serving"]
workers_dev = true

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/posts/*", "/sitemap.xml"]

# Cloudflare 会在新仓库的配置中替换资源 ID。
[[d1_databases]]
binding = "DB"
database_name = "blog-db2"
database_id = "fa1a5fce-0896-48f2-86b3-95e178e2aaa4"

[[kv_namespaces]]
binding = "CACHE"
id = "48461fe220e845bea1c3d1e528f85511"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "blog-storage2"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
